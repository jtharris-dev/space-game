<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06080f">
  <title>Cosmic Frontier</title>
  <style>
/* ============================================================
   COSMIC FRONTIER - Stylesheet
   Dark space theme with neon accents and smooth animations
   ============================================================ */

/* ---- RESET & BASE ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #06080f;
  --surface:     #0c1020;
  --surface2:    #121830;
  --surface3:    #1a2240;
  --border:      #1e2d50;
  --border2:     #2a3d6a;
  --text:        #c8d8f8;
  --text-dim:    #6880a8;
  --text-bright: #e8f0ff;
  --cyan:        #00d4ff;
  --gold:        #ffd700;
  --green:       #2ecc71;
  --red:         #e74c3c;
  --purple:      #9b59b6;
  --orange:      #f39c12;
  --pink:        #ff44aa;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Courier New', Courier, monospace;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 4px 20px rgba(0,0,0,0.5);
  --glow-cyan: 0 0 20px rgba(0,212,255,0.3);
  --glow-gold: 0 0 20px rgba(255,215,0,0.3);
  --transition: 0.2s ease;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ---- SCROLLBAR ---- */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ---- STARFIELD ---- */
#starfield {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
}

/* ---- PARTICLES ---- */
#particles {
  position: fixed; inset: 0; z-index: 10;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  animation: particle-burst 0.8s ease-out forwards;
}

@keyframes particle-burst {
  0%   { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}

/* ---- SPLASH SCREEN ---- */
#splash {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg);
  transition: opacity 0.6s;
}

#splash.fade-out { opacity: 0; }

.splash-logo {
  font-size: 3.5rem;
  margin-bottom: 8px;
  animation: float 3s ease-in-out infinite;
}

.splash-title {
  font-size: 2rem;
  font-weight: 700;
  color: var(--cyan);
  letter-spacing: 3px;
  text-shadow: var(--glow-cyan);
  margin-bottom: 4px;
}

.splash-sub {
  font-size: 0.85rem;
  color: var(--text-dim);
  letter-spacing: 5px;
  margin-bottom: 40px;
}

.splash-bar-bg {
  width: 260px; height: 4px;
  background: var(--surface3);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 12px;
}

.splash-bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  transition: width 0.12s linear;
  box-shadow: 0 0 10px var(--cyan);
}

.splash-status {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
  letter-spacing: 1px;
}

/* ---- MAIN LAYOUT ---- */
#app {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  max-width: 540px;
  margin: 0 auto;
}

/* ---- HEADER ---- */
#location-header {
  background: linear-gradient(180deg, rgba(12,16,32,0.98) 0%, rgba(6,8,15,0.95) 100%);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  flex-shrink: 0;
  z-index: 5;
}

.location-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid;
  border-radius: var(--radius);
  margin-bottom: 6px;
}

.location-icon { font-size: 2rem; }

.location-name {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-bright);
}

.location-dist {
  font-size: 0.72rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

.base-indicator {
  margin-left: auto;
  font-size: 0.7rem;
  color: var(--gold);
  background: rgba(255,215,0,0.1);
  padding: 3px 8px;
  border-radius: 12px;
  border: 1px solid rgba(255,215,0,0.3);
}

/* Mission inline */
.mission-inline {
  padding: 4px 0 2px;
}

.mission-label {
  font-size: 0.72rem;
  color: var(--cyan);
  margin-bottom: 4px;
  font-family: var(--font-mono);
}

.mission-bar-wrap {
  height: 4px;
  background: var(--surface3);
  border-radius: 2px;
  overflow: hidden;
}

.mission-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  transition: width 0.5s linear;
  box-shadow: 0 0 8px var(--cyan);
  position: relative;
}

.mission-bar-wrap.big { height: 12px; border-radius: 6px; }
.mission-bar-wrap.big .mission-bar { border-radius: 6px; }

.thruster-glow {
  position: absolute; right: -4px; top: -4px; bottom: -4px; width: 12px;
  background: radial-gradient(ellipse, var(--cyan), transparent);
  animation: thruster 0.3s ease-in-out infinite alternate;
}

@keyframes thruster {
  from { opacity: 0.5; width: 10px; }
  to   { opacity: 1.0; width: 20px; }
}

/* ---- RESOURCES BAR ---- */
#resources-bar {
  display: flex;
  gap: 6px;
  padding: 8px 14px;
  overflow-x: auto;
  flex-shrink: 0;
  background: rgba(6,8,15,0.9);
  border-bottom: 1px solid var(--border);
  scrollbar-width: thin;
}

.resource-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 10px;
  flex-shrink: 0;
  min-width: 90px;
  transition: border-color var(--transition);
  position: relative;
}

.resource-chip:hover { border-color: var(--res-color, var(--border2)); }

.res-icon { font-size: 1rem; }

.res-details { flex: 1; min-width: 0; }

.res-name {
  font-size: 0.65rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.res-amount {
  font-size: 0.8rem;
  font-family: var(--font-mono);
  color: var(--text-bright);
  white-space: nowrap;
}

.res-rate {
  font-size: 0.65rem;
  color: var(--green);
}

.res-bar-bg {
  height: 2px;
  background: var(--surface3);
  border-radius: 1px;
  margin-top: 2px;
  overflow: hidden;
}

.res-bar-fill {
  height: 100%;
  border-radius: 1px;
  transition: width 0.5s;
}

/* ---- TAB CONTENT ---- */
#tab-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
}

.tab-content { display: none; padding: 14px; }
.tab-content.active { display: block; }

/* ---- BOTTOM NAV ---- */
#bottom-nav {
  display: flex;
  background: rgba(10,12,22,0.98);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.6rem;
  font-family: var(--font);
  gap: 3px;
  transition: color var(--transition), background var(--transition);
  position: relative;
  -webkit-tap-highlight-color: transparent;
}

.tab-btn .tab-icon { font-size: 1.3rem; }
.tab-btn .tab-label { letter-spacing: 0.5px; }

.tab-btn.active {
  color: var(--cyan);
}

.tab-btn.active::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 2px;
  background: var(--cyan);
  box-shadow: var(--glow-cyan);
  border-radius: 0 0 2px 2px;
}

.tab-btn:active { background: rgba(255,255,255,0.05); }

/* ---- BASE TAB ---- */
.base-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

/* Planet visual */
.planet-container {
  position: relative;
  width: 140px; height: 140px;
  display: flex; align-items: center; justify-content: center;
}

.planet-sphere {
  width: 120px; height: 120px;
  border-radius: 50%;
  position: relative;
  animation: planet-rotate 20s linear infinite;
}

.planet-atmosphere {
  position: absolute; inset: -8px;
  border-radius: 50%;
}

.planet-ring {
  position: absolute;
  width: 160px; height: 40px;
  border-radius: 50%;
  border: 4px solid;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotateX(75deg);
  opacity: 0.7;
}

@keyframes planet-rotate {
  from { filter: hue-rotate(0deg); }
  to   { filter: hue-rotate(10deg); }
}

.location-desc {
  text-align: center;
  color: var(--text);
  font-size: 0.88rem;
  line-height: 1.5;
}

.flavor-text {
  text-align: center;
  color: var(--text-dim);
  font-style: italic;
  font-size: 0.8rem;
}

.available-resources { width: 100%; }
.available-resources h3 {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.resource-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.res-tag {
  padding: 3px 10px;
  border: 1px solid;
  border-radius: 12px;
  font-size: 0.75rem;
  background: rgba(255,255,255,0.03);
}

/* Mine Button */
.mine-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #1e3070, #0a1830);
  border: 3px solid var(--cyan);
  box-shadow: var(--glow-cyan), inset 0 0 30px rgba(0,212,255,0.1);
  cursor: pointer;
  color: var(--text-bright);
  transition: transform var(--transition), box-shadow var(--transition);
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
}

.mine-btn::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, rgba(0,212,255,0.15), transparent 70%);
  opacity: 0;
  transition: opacity 0.1s;
}

.mine-btn:active, .mine-btn.mining {
  transform: scale(0.93);
  box-shadow: var(--glow-cyan), inset 0 0 50px rgba(0,212,255,0.25);
}

.mine-btn:active::after, .mine-btn.mining::after { opacity: 1; }

.mine-icon { font-size: 2.2rem; margin-bottom: 2px; }

.mine-text {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--cyan);
}

.mine-sub {
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}

.auto-prod {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 0.78rem;
}

.auto-label { color: var(--gold); margin-right: 8px; }
.auto-rates { color: var(--green); }

.hint-box {
  width: 100%;
  background: rgba(255,215,0,0.05);
  border: 1px solid rgba(255,215,0,0.2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 0.8rem;
  color: var(--gold);
}

.secret-banner {
  width: 100%;
  background: rgba(0,212,255,0.08);
  border: 1px solid var(--cyan);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 0.8rem;
  color: var(--cyan);
  text-align: center;
  animation: pulse-border 2s ease-in-out infinite;
}

@keyframes pulse-border {
  0%, 100% { box-shadow: 0 0 5px rgba(0,212,255,0.2); }
  50%       { box-shadow: 0 0 20px rgba(0,212,255,0.5); }
}

/* ---- RESEARCH TAB ---- */
.active-research {
  background: var(--surface);
  border: 1px solid var(--cyan);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 14px;
  box-shadow: var(--glow-cyan);
}

.ar-header {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  margin-bottom: 8px;
}

.ar-header strong { color: var(--cyan); }

.ar-bar-bg {
  height: 6px;
  background: var(--surface3);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}

.ar-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  border-radius: 3px;
  transition: width 0.5s linear;
  box-shadow: 0 0 10px var(--cyan);
}

.cancel-btn {
  font-size: 0.72rem;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 10px;
  cursor: pointer;
}
.cancel-btn:hover { color: var(--red); border-color: var(--red); }

.research-queue {
  background: var(--surface);
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.queue-item {
  display: inline-block;
  background: var(--surface3);
  padding: 2px 8px;
  border-radius: 4px;
  margin: 2px;
  font-size: 0.72rem;
}

.tech-tier { margin-bottom: 20px; }

.tier-title {
  font-size: 0.78rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}

.tech-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tech-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: border-color var(--transition);
}

.tech-card.done {
  border-color: var(--green);
  background: rgba(46,204,113,0.05);
}

.tech-card.active {
  border-color: var(--cyan);
  box-shadow: var(--glow-cyan);
  animation: pulse-border 1.5s ease-in-out infinite;
}

.tech-card.locked {
  opacity: 0.5;
}

.tech-card.blocked {
  opacity: 0.6;
}

.tech-icon { font-size: 1.4rem; }
.tech-name { font-size: 0.82rem; font-weight: 700; color: var(--text-bright); }
.tech-desc { font-size: 0.72rem; color: var(--text-dim); line-height: 1.4; }

.tech-unlocks {
  font-size: 0.68rem;
  color: var(--purple);
  background: rgba(155,89,182,0.1);
  padding: 3px 6px;
  border-radius: 4px;
}

.tech-cost, .build-cost, .rocket-cost { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }

.cost-item {
  font-size: 0.68rem;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
}

.cost-item.ok { color: var(--green); background: rgba(46,204,113,0.1); }
.cost-item.short { color: var(--red); background: rgba(231,76,60,0.1); }

.tech-status { margin-top: 4px; }

.done-badge { font-size: 0.7rem; color: var(--green); }
.active-badge { font-size: 0.7rem; color: var(--cyan); }
.blocked-badge { font-size: 0.7rem; color: var(--text-dim); }

.research-btn, .build-btn, .build-rocket-btn, .launch-target-btn {
  margin-top: 6px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: white;
  font-size: 0.72rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: opacity var(--transition), transform var(--transition);
}

.research-btn:active, .build-btn:active, .build-rocket-btn:active { transform: scale(0.97); }
.research-btn.disabled, .build-btn.disabled, .build-rocket-btn.disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: var(--surface3);
  color: var(--text-dim);
}

/* ---- BUILD TAB ---- */
.build-view h3 {
  font-size: 0.78rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 10px;
  margin-top: 14px;
}

.existing-buildings {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.building-existing {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--green);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.78rem;
  color: var(--green);
}

.building-count {
  font-family: var(--font-mono);
  font-weight: 700;
}

.build-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.build-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.build-card.locked { opacity: 0.5; }
.build-card.blocked { opacity: 0.65; }
.build-card.maxed { border-color: var(--gold); }

.build-icon { font-size: 1.4rem; }
.build-name { font-size: 0.82rem; font-weight: 700; color: var(--text-bright); }
.build-desc { font-size: 0.7rem; color: var(--text-dim); line-height: 1.4; }
.build-req, .rocket-req { font-size: 0.68rem; color: var(--text-dim); }
.maxed-label { font-size: 0.7rem; color: var(--gold); font-weight: 700; margin-top: 4px; }
.blocked-label { font-size: 0.7rem; color: var(--red); margin-top: 4px; }

.count-badge {
  font-size: 0.65rem;
  background: var(--surface3);
  padding: 1px 5px;
  border-radius: 8px;
  color: var(--gold);
}

/* ---- LAUNCH TAB ---- */
.active-mission {
  background: var(--surface);
  border: 1px solid var(--cyan);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 16px;
  box-shadow: var(--glow-cyan);
}

.mission-title {
  font-size: 0.75rem;
  color: var(--cyan);
  letter-spacing: 2px;
  margin-bottom: 8px;
  font-weight: 700;
}

.mission-detail {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 0.9rem;
  margin-bottom: 6px;
  color: var(--text-bright);
}

.mission-arrow { color: var(--cyan); font-size: 1rem; animation: blink 1s step-start infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

.mission-rocket { font-size: 0.78rem; color: var(--text-dim); text-align: center; margin-bottom: 4px; }
.mission-time { font-size: 0.9rem; color: var(--gold); text-align: center; margin-bottom: 10px; font-family: var(--font-mono); }

.hangar-section { margin-bottom: 20px; }
.hangar-section h3, .build-rockets h3 {
  font-size: 0.78rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.empty-hint {
  color: var(--text-dim);
  font-size: 0.8rem;
  text-align: center;
  padding: 16px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

.hangar-list { display: flex; flex-direction: column; gap: 10px; }

.hangar-entry {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 12px;
}

.rocket-display {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.rocket-icon-lg { font-size: 2rem; }
.rocket-name { font-size: 0.85rem; font-weight: 700; color: var(--text-bright); }
.rocket-desc { font-size: 0.72rem; color: var(--text-dim); }

.launch-targets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.launch-target-btn {
  padding: 6px 12px;
  border-radius: 16px;
  border: 1px solid var(--cyan);
  background: rgba(0,212,255,0.1);
  color: var(--cyan);
  font-size: 0.75rem;
  cursor: pointer;
  transition: background var(--transition);
}

.launch-target-btn:hover:not(.disabled) { background: rgba(0,212,255,0.2); }
.launch-target-btn.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  border-color: var(--border);
  color: var(--text-dim);
  background: transparent;
}

.no-targets { font-size: 0.75rem; color: var(--text-dim); }

.rocket-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.rocket-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rocket-card.locked { opacity: 0.5; }
.rocket-icon { font-size: 1.6rem; }
.rocket-name { font-size: 0.82rem; font-weight: 700; color: var(--text-bright); }
.rocket-tier { font-size: 0.65rem; color: var(--purple); text-transform: uppercase; }

/* ---- MAP TAB ---- */
.galaxy-map { display: flex; flex-direction: column; gap: 20px; }

.map-group {}
.map-group-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.map-nodes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.map-node {
  flex: 1; min-width: 100px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--transition), transform var(--transition);
  position: relative;
}

.map-node:hover { border-color: var(--loc-color, var(--border2)); transform: translateY(-2px); }

.map-node.current {
  border-color: var(--loc-color, var(--cyan));
  box-shadow: 0 0 15px rgba(var(--loc-color), 0.3);
}

.map-node.unknown { opacity: 0.4; cursor: default; }

.map-node-icon { font-size: 1.8rem; margin-bottom: 4px; }
.map-node-name { font-size: 0.78rem; font-weight: 700; color: var(--text-bright); }
.map-node-dist { font-size: 0.65rem; color: var(--text-dim); font-family: var(--font-mono); margin-top: 2px; }

.here-badge {
  position: absolute;
  top: -8px; left: 50%; transform: translateX(-50%);
  background: var(--cyan);
  color: var(--bg);
  font-size: 0.55rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 8px;
  white-space: nowrap;
  letter-spacing: 0.5px;
}

.base-badge {
  font-size: 0.6rem;
  color: var(--gold);
  background: rgba(255,215,0,0.1);
  border-radius: 4px;
  padding: 2px 4px;
  margin-top: 4px;
  display: inline-block;
}

.secret-badge {
  font-size: 0.6rem;
  color: var(--cyan);
  background: rgba(0,212,255,0.1);
  border-radius: 4px;
  padding: 2px 4px;
  margin-top: 2px;
  display: inline-block;
}

/* ---- LOG TAB ---- */
.log-view { display: flex; flex-direction: column; gap: 16px; }

.stats-panel, .achievements-panel, .save-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}

.stats-panel h3, .achievements-panel h3 {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-item {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  background: var(--surface2);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
}

.stat-item span:first-child { color: var(--text-dim); }
.stat-item span:last-child { color: var(--cyan); font-family: var(--font-mono); }

.achievement-list { display: flex; flex-direction: column; gap: 6px; }

.achievement {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  border: 1px solid transparent;
}

.achievement.earned { border-color: var(--gold); background: rgba(255,215,0,0.05); }
.achievement.locked { opacity: 0.4; }

.ach-icon { font-size: 1.2rem; }
.ach-info { flex: 1; }
.ach-name { font-size: 0.8rem; font-weight: 700; color: var(--text-bright); }
.ach-desc { font-size: 0.7rem; color: var(--text-dim); }
.ach-check { color: var(--gold); }

.save-panel {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.save-btn, .reset-btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 700;
  transition: opacity var(--transition);
}

.save-btn { background: var(--green); color: white; }
.reset-btn { background: var(--red); color: white; }
.save-btn:hover, .reset-btn:hover { opacity: 0.85; }

/* ---- OVERLAYS ---- */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.overlay.active { display: flex; }

.overlay-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 420px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  text-align: center;
  position: relative;
}

/* Secret overlay */
#secret-overlay .overlay-box {
  border-color: var(--cyan);
  box-shadow: var(--glow-cyan), 0 0 80px rgba(0,212,255,0.1);
}

.secret-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
  letter-spacing: 1px;
  margin-bottom: 20px;
  animation: pulse-border 1.5s ease-in-out infinite;
}

.secret-messages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

.secret-message {
  background: var(--surface2);
  border-left: 3px solid var(--cyan);
  padding: 10px 14px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.82rem;
  color: var(--text);
  text-align: left;
  opacity: 0;
  transform: translateX(-20px);
  transition: opacity 0.5s, transform 0.5s;
}

.secret-message.show { opacity: 1; transform: translateX(0); }

.secret-close-btn {
  padding: 12px 30px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: var(--glow-cyan);
  animation: pulse-border 1s ease-in-out infinite;
}

/* Arrival overlay */
.arrival-icon { font-size: 4rem; margin-bottom: 10px; animation: float 2s ease-in-out infinite; }
.arrival-name { font-size: 1.4rem; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
.arrival-dist { font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); margin-bottom: 12px; }
.arrival-flavor { font-style: italic; color: var(--text-dim); margin-bottom: 16px; font-size: 0.85rem; }
.arrival-resources { font-size: 0.78rem; color: var(--text); margin-bottom: 20px; }

#arrival-overlay .overlay-box button {
  padding: 12px 30px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
}

/* Offline overlay */
.offline-title { font-size: 1.2rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
.offline-time { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 16px; }
.offline-subtitle { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 10px; }
.offline-resources { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.offline-resource {
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 0.8rem;
  color: var(--green);
  text-align: left;
}

#offline-overlay .overlay-box button {
  padding: 10px 24px;
  background: var(--green);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-weight: 700;
  cursor: pointer;
}

/* ---- NOTIFICATIONS ---- */
#notifications {
  position: fixed;
  top: 10px; right: 10px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 300px;
  pointer-events: none;
}

.notification {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 0.8rem;
  color: var(--text);
  opacity: 0;
  transform: translateX(30px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: auto;
}

.notification.show { opacity: 1; transform: translateX(0); }
.notification.success { border-color: var(--green); color: var(--green); }
.notification.error { border-color: var(--red); color: var(--red); }
.notification.warning { border-color: var(--orange); color: var(--orange); }
.notification.info { border-color: var(--cyan); color: var(--cyan); }
.notification.launch { border-color: var(--purple); color: var(--purple); }

.notification.achievement-popup {
  background: var(--surface);
  border-color: var(--gold);
  color: var(--gold);
  max-width: 280px;
}

.ach-popup-inner { display: flex; align-items: center; gap: 10px; }
.ach-popup-icon { font-size: 1.5rem; }
.ach-popup-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
.ach-popup-name { font-size: 0.85rem; font-weight: 700; }
.ach-popup-desc { font-size: 0.72rem; opacity: 0.8; }

/* ---- FLOATING TEXT ---- */
.float-text {
  position: fixed;
  z-index: 150;
  font-size: 0.9rem;
  font-weight: 700;
  font-family: var(--font-mono);
  pointer-events: none;
  opacity: 0;
  transform: translateY(0);
  transition: none;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.float-text.float-up {
  animation: float-up 1.2s ease-out forwards;
}

@keyframes float-up {
  0%   { opacity: 1; transform: translateY(0); }
  80%  { opacity: 1; transform: translateY(-60px); }
  100% { opacity: 0; transform: translateY(-80px); }
}

/* ---- TUTORIAL ---- */
#tutorial-popup {
  position: fixed;
  bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 300;
  width: calc(100% - 40px);
  max-width: 400px;
  background: var(--surface);
  border: 1px solid var(--cyan);
  border-radius: var(--radius);
  box-shadow: var(--glow-cyan), var(--shadow);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

#tutorial-popup.show { opacity: 1; pointer-events: auto; }

.tutorial-inner { padding: 16px; }
.tutorial-title { font-size: 0.9rem; font-weight: 700; color: var(--cyan); margin-bottom: 8px; }
.tutorial-text { font-size: 0.8rem; color: var(--text); line-height: 1.5; margin-bottom: 12px; }

.tutorial-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tutorial-footer span { font-size: 0.72rem; color: var(--text-dim); }

.tutorial-footer button {
  padding: 8px 16px;
  background: var(--cyan);
  color: var(--bg);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
}

.tutorial-highlight {
  animation: highlight-pulse 0.8s ease-in-out 3;
}

@keyframes highlight-pulse {
  0%, 100% { box-shadow: none; }
  50%       { box-shadow: 0 0 0 4px var(--cyan), var(--glow-cyan); }
}

/* ---- UTILITIES ---- */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-8px); }
}

.no-resources {
  color: var(--text-dim);
  font-size: 0.8rem;
  padding: 8px;
  font-style: italic;
}

/* ---- RESPONSIVE ---- */
@media (max-width: 360px) {
  .tech-grid, .build-grid, .rocket-grid { grid-template-columns: 1fr; }
}

@media (min-width: 540px) {
  #app {
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
}

  </style>
