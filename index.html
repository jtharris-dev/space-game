<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06080f">
  <link rel="manifest" href="manifest.json">
  <title>Cosmic Frontier</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Starfield background canvas (always behind everything) -->
<canvas id="starfield"></canvas>

<!-- Photorealistic scene canvas (fills #scene-view) -->
<!-- Scene layer: only used for travel warp overlay now -->
<div id="scene-layer">
  <div class="scene-speed-overlay"></div>
</div>

<!-- Particle effects (above scene, below app) -->
<div id="particles"></div>

<!-- Splash screen -->
<div id="splash">
  <div class="splash-logo">🚀</div>
  <div class="splash-title">COSMIC FRONTIER</div>
  <div class="splash-sub">DEEP SPACE EXPLORATION</div>
  <div class="splash-bar-bg"><div class="splash-bar-fill"></div></div>
  <div class="splash-status">Initializing systems...</div>
</div>

<!-- ======== MAIN APP ======== -->
<div id="app">

  <!-- Slim top HUD -->
  <div id="hud-top">
    <div id="hud-location">
      <!-- Rendered by renderHUDTop() -->
    </div>
    <div id="hud-mission-strip">
      <!-- Mission progress appears here during missions -->
    </div>
  </div>

  <!-- Compact resource strip -->
  <div id="hud-resources">
    <!-- Rendered by renderResources() -->
  </div>

  <!-- SCENE VIEW: fills all remaining vertical space, tap to mine -->
  <div id="scene-view"
    ontouchstart="onSceneTouchStart(event)"
    onclick="onSceneClick(event)">

    <!-- Photorealistic surface canvas (rendered by scenes.js) -->
    <canvas id="scene-canvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

    <!-- Cockpit window frame overlay -->
    <div id="cockpit-frame" aria-hidden="true">
      <div class="cframe-corner tl"></div>
      <div class="cframe-corner tr"></div>
      <div class="cframe-corner bl"></div>
      <div class="cframe-corner br"></div>
    </div>

    <!-- Tap ripple effects injected here by JS -->
    <div id="mine-ripple-layer"></div>

    <!-- Scene art / location overlay (structures, labels) -->
    <div id="scene-overlay">
      <!-- Rendered by renderSceneOverlay() -->
    </div>

    <!-- First-time tap hint (auto-fades) -->
    <div id="tap-hint-wrap">
      <div id="tap-hint">⛏ tap to mine</div>
    </div>

  </div><!-- #scene-view -->

  <!-- Mining focus selector -->
  <div id="focus-bar">
    <span class="focus-bar-label">FOCUS</span>
    <div id="focus-resources-row">
      <!-- Rendered by renderFocusBar() -->
    </div>
  </div>

  <!-- Icon-only bottom navigation -->
  <nav id="bottom-nav">
    <button class="tab-btn active" data-tab="base">
      <span class="tab-icon">🌍</span>
      <div class="tab-dot"></div>
    </button>
    <button class="tab-btn" data-tab="research">
      <span class="tab-icon">🔬</span>
      <div class="tab-dot"></div>
    </button>
    <button class="tab-btn" data-tab="build">
      <span class="tab-icon">🏗</span>
      <div class="tab-dot"></div>
    </button>
    <button class="tab-btn" data-tab="launch">
      <span class="tab-icon">🚀</span>
      <div class="tab-dot"></div>
    </button>
    <button class="tab-btn" data-tab="map">
      <span class="tab-icon">🗺</span>
      <div class="tab-dot"></div>
    </button>
    <button class="tab-btn" data-tab="log">
      <span class="tab-icon">📋</span>
      <div class="tab-dot"></div>
    </button>
  </nav>

  <!-- ===== SLIDE-UP PANELS ===== -->

  <div id="panel-research" class="slide-panel">
    <div class="panel-handle-bar"><div class="handle-pill"></div></div>
    <div class="panel-header">
      <span class="panel-title">🔬 Research</span>
      <button class="panel-close" onclick="UI.closePanel()">✕</button>
    </div>
    <div class="panel-scroll">
      <div id="tab-research"></div>
    </div>
  </div>

  <div id="panel-build" class="slide-panel">
    <div class="panel-handle-bar"><div class="handle-pill"></div></div>
    <div class="panel-header">
      <span class="panel-title">🏗 Build</span>
      <button class="panel-close" onclick="UI.closePanel()">✕</button>
    </div>
    <div class="panel-scroll">
      <div id="tab-build"></div>
    </div>
  </div>

  <div id="panel-launch" class="slide-panel">
    <div class="panel-handle-bar"><div class="handle-pill"></div></div>
    <div class="panel-header">
      <span class="panel-title">🚀 Launch</span>
      <button class="panel-close" onclick="UI.closePanel()">✕</button>
    </div>
    <div class="panel-scroll">
      <div id="tab-launch"></div>
    </div>
  </div>

  <div id="panel-map" class="slide-panel">
    <div class="panel-handle-bar"><div class="handle-pill"></div></div>
    <div class="panel-header">
      <span class="panel-title">🗺 Star Map</span>
      <button class="panel-close" onclick="UI.closePanel()">✕</button>
    </div>
    <div class="panel-scroll">
      <div id="tab-map"></div>
    </div>
  </div>

  <div id="panel-log" class="slide-panel">
    <div class="panel-handle-bar"><div class="handle-pill"></div></div>
    <div class="panel-header">
      <span class="panel-title">📋 Mission Log</span>
      <button class="panel-close" onclick="UI.closePanel()">✕</button>
    </div>
    <div class="panel-scroll">
      <div id="tab-log"></div>
    </div>
  </div>

  <!-- Panel backdrop (tap to close) -->
  <div id="panel-backdrop" onclick="UI.closePanel()"></div>

</div><!-- #app -->

<!-- ============ OVERLAYS ============ -->

<div class="overlay" id="secret-overlay">
  <div class="overlay-box">
    <div id="secret-content"></div>
  </div>
</div>

<div class="overlay" id="arrival-overlay">
  <div class="overlay-box">
    <div id="arrival-content"></div>
  </div>
</div>

<div class="overlay" id="offline-overlay">
  <div class="overlay-box">
    <div id="offline-content"></div>
  </div>
</div>

<div id="notifications"></div>
<div id="tutorial-popup"></div>

<!-- ============ SCRIPTS ============ -->
<script src="js/scenes.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/actions.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
